<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Bottom layer: 135deg orange-to-teal gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e85a2a"/>
      <stop offset="25%" stop-color="#d4890f"/>
      <stop offset="40%" stop-color="#e09a15"/>
      <stop offset="50%" stop-color="#d4a82e"/>
      <stop offset="65%" stop-color="#00918a"/>
      <stop offset="80%" stop-color="#008580"/>
      <stop offset="100%" stop-color="#005a5a"/>
    </linearGradient>
    
    <!-- Top layer: White fade (vertical) - solid at top/bottom, transparent in middle -->
    <linearGradient id="whiteFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="8%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  
  <!-- Base gradient layer -->
  <rect width="100%" height="100%" fill="url(#mainGradient)"/>
  
  <!-- White fade overlay -->
  <rect width="100%" height="100%" fill="url(#whiteFade)"/>
</svg>
