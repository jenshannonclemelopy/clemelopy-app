name = "som-app"
main = "index.js"
compatibility_date = "2024-01-01"

# ============================================
# ENVIRONMENT VARIABLES
# Set secrets via: wrangler secret put SECRET_NAME
# ============================================

# Required secrets (set via wrangler secret put):
# - OPENAI_API_KEY
# - ANTHROPIC_API_KEY
# - PERPLEXITY_API_KEY
# - GEMINI_API_KEY (optional)
# - SUPABASE_URL
# - SUPABASE_SERVICE_KEY

[vars]
# Non-secret variables can go here
ALLOW_ORIGIN = "https://app.clemelopy.com"

# ============================================
# DEPLOYMENT
# ============================================

# Customer-facing worker for app.clemelopy.com
# Deploy with: wrangler deploy
# URL will be: https://som-app.jen-86f.workers.dev
#
# Your CMS worker remains at: https://share-of-model.jen-86f.workers.dev
